<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GeoLearn</title>
    <meta name="description" content="Know your world. Practice country outlines, flags, and capitals with GeoLearn's free geography flashcards." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://gquiz.pirategames.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeoLearn" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="GeoLearn — Know your world." />
    <meta property="og:description" content="Practice country outlines, flags, and capitals with free geography flashcards. Play at your own pace, online or offline." />
    <meta property="og:url" content="https://gquiz.pirategames.org/" />
    <meta property="og:image" content="https://gquiz.pirategames.org/images/og/geolearn.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Earth globe centered on a plain dark navy background, showing the Americas, Europe, and Africa." />
    <meta property="og:image" content="https://gquiz.pirategames.org/images/og/geolearn-square.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="An Earth globe centered on a plain dark navy background, showing the Americas, Europe, and Africa." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GeoLearn — Know your world." />
    <meta name="twitter:description" content="Practice country outlines, flags, and capitals with free geography flashcards. Play at your own pace, online or offline." />
    <meta name="twitter:image" content="https://gquiz.pirategames.org/images/og/geolearn-twitter.jpg" />
    <meta name="twitter:image:alt" content="An Earth globe centered on a plain dark navy background, showing the Americas, Europe, and Africa." />

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="topbar">
        <div>
          <h1>GeoLearn</h1>
          <div class="header-selects">
            <select id="modeSelect">
              <option value="outlines">Outlines</option>
              <option value="flags">Flags</option>
              <option value="capitals">Capitals</option>
            </select>
            <div class="continent-dropdown" id="continentDropdown">
              <button type="button" class="continent-btn" id="continentBtn">All Continents</button>
              <div class="continent-panel hidden" id="continentPanel">
                <label class="continent-option"><input type="checkbox" value="Africa" checked /> Africa</label>
                <label class="continent-option"><input type="checkbox" value="Asia" checked /> Asia</label>
                <label class="continent-option"><input type="checkbox" value="Europe" checked /> Europe</label>
                <label class="continent-option"><input type="checkbox" value="North America" checked /> N. America</label>
                <label class="continent-option"><input type="checkbox" value="South America" checked /> S. America</label>
                <label class="continent-option"><input type="checkbox" value="Oceania" checked /> Oceania</label>
                <div class="continent-divider"></div>
                <label class="continent-option"><input type="checkbox" id="microstateToggle" checked /> Include microstates</label>
              </div>
            </div>
            <button
              id="searchToggle"
              class="icon-btn search-toggle"
              type="button"
              aria-label="Open country search"
              aria-controls="countrySearch"
              aria-expanded="false"
            >
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path d="m21 21-4.35-4.35" />
                <circle cx="11" cy="11" r="7" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <section class="search-wrap" aria-label="Country search">
        <input id="countrySearch" type="text" placeholder="Search country or code (e.g. Rwanda or RW)" autocomplete="off" />
        <ul id="searchResults" class="search-results hidden" role="listbox" aria-label="Country suggestions"></ul>
      </section>

      <section class="stats" aria-live="polite">
        <div class="study-tools">
          <button id="backBtn" class="back-btn" tabindex="-1" aria-label="Previous card" disabled>&#8634;</button>
          <button id="freezeBtn" class="back-btn freeze-btn" type="button" aria-label="Freeze score lists" aria-pressed="false"><span aria-hidden="true">❄️</span></button>
        </div>
        <span id="progress">0 / 0</span>
        <span id="score"><span id="wrongScore" class="score-tap" role="button" tabindex="-1">❌ 0</span> <span id="rightScore" class="score-tap" role="button" tabindex="-1">✅ 0</span></span>
      </section>

      <section class="card-wrap">
        <article class="card" id="card" aria-label="Flash card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </article>
      </section>

      <section class="actions">
        <button id="wrongBtn" class="btn wrong" tabindex="-1">← Wrong</button>
        <button id="flipBtn" class="btn neutral" tabindex="-1">Tap / Flip</button>
        <button id="rightBtn" class="btn right" tabindex="-1">Right →</button>
      </section>

      <p class="hint">Swipe left = wrong, swipe right = right</p>
      <p id="offlineStatus" class="offline-status" role="status"></p>
      <div id="toast" class="toast" aria-live="assertive"></div>

      <dialog id="scoreModal" class="score-modal">
        <form method="dialog" class="score-modal-inner">
          <header class="score-modal-header">
            <h2 id="scoreModalTitle">Wrong Answers</h2>
            <button class="icon-btn" aria-label="Close modal">&times;</button>
          </header>
          <ul id="scoreModalList" class="score-modal-list"></ul>
          <button id="clearListBtn" type="button" class="btn neutral score-modal-clear">Clear List</button>
        </form>
      </dialog>

    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
